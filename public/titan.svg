<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Orange geometric Titan logo -->
  <defs>
    <linearGradient id="titanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main geometric shape: upward triangle with inner cutout -->
  <polygon points="50,10 90,85 10,85" fill="url(#titanGradient)" />
  <polygon points="50,35 75,75 25,75" fill="white" />
  <!-- Top accent dot -->
  <circle cx="50" cy="18" r="4" fill="white" opacity="0.8" />
</svg>
